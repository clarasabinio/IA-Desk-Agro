# ==============================================================================
# Docker Compose para IA Desk Agro (Desarrollo y Ejecución Local Gratuita)
# ==============================================================================
version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ia_desk_agro_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,https://*.ngrok-free.app,https://*.trycloudflare.com
    volumes:
      # Persistencia de datos locales en la máquina anfitriona (sin base de datos paga)
      - ./db.sqlite3:/app/db.sqlite3
      - ./files_storage:/app/files_storage
      - ./media:/app/media
      # Mapeo de código en vivo para desarrollo
      - ./app:/app/app
      - ./core:/app/core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
